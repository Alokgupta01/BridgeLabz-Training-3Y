<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <aside>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
        </aside>

        <main>
            <h2>Dashboard Overview</h2>

            <div class="boxes">
                <div class="box">
                    <h3>Total Projects</h3>
                    <p>5</p>
                </div>

                <div class="box">
                    <h3>Completed Tasks</h3>
                    <p>4</p>
                </div>

                <div class="box">
                    <h3>Pending Tasks</h3>
                    <p>1</p>
                </div>
            </div>
        </main>

    </div>

</body>
</html>
