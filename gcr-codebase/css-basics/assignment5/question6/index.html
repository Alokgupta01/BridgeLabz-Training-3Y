<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
    </header>

    <main class="gallery">

        <div class="photo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNcR_iD_h8q8fi0CgRQlhvlNlHg0UAfdQp_yPbrZMMhw&s=10" alt="Mountain">
            <div class="caption">Beautiful Mountain</div>
        </div>

        <div class="photo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7yiHXY0ns-sSxOzPYNHmEtpZwAw4DoU9unvcATClWMQ&s=10" alt="Beach">
            <div class="caption">Peaceful Beach</div>
        </div>

        <div class="photo">
            <img src="https://treed.in/cdn/shop/articles/pexels-francesco-ungaro-1671324.jpg?v=1631942933" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZjG_6u_FubYL2CrjdmrU5HAkqseTbXzdsqY8q0kSdFA&s=10" alt="City">
            <div class="caption">Beautiful City</div>
        </div>

        <div class="photo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTaJb45eHsCtg1SOGN2OcurzmxnIxJxmoEEdp-5bplKMA&s" alt="Lake">
            <div class="caption">Calm Lake</div>
        </div>

        <div class="photo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbHDoNRVxvLZvvCUnMcJYg97KSz9nWLHEgmwMt0hzgkA&s=10" alt="Sunset">
            <div class="caption">Amazing Sunset</div>
        </div>

    </main>

    <footer>
        <p>© 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
