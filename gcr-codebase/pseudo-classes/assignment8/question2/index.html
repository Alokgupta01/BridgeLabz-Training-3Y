<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Tooltips</h1>
    </header>

    <main>
        <section class="tooltip-container">

            <div class="tooltip-item">
                <span>Home</span>
                <div class="tooltip">Go to Home</div>
            </div>

            <div class="tooltip-item">
                <span>Profile</span>
                <div class="tooltip">View Profile</div>
            </div>

            <div class="tooltip-item">
                <span>Settings</span>
                <div class="tooltip">Open Settings</div>
            </div>

            <div class="tooltip-item">
                <span>Contact</span>
                <div class="tooltip">Contact Us</div>
            </div>

        </section>
    </main>

    <footer>
        <p>Tooltip Demonstration</p>
    </footer>

</body>
</html>
