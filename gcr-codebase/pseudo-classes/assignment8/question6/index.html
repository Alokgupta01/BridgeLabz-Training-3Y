<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Animation Demonstration</h1>
    </header>

    <main>
        <section class="animations">

            <div class="animation-box">
                <div class="moving-box"></div>
                <p>Moving Box</p>
            </div>

            <div class="animation-box">
                <div class="ball"></div>
                <p>Bouncing Ball</p>
            </div>

            <div class="animation-box">
                <h2 class="changing-text">Animation</h2>
                <p>Color Changing Text</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Animation Demonstration</p>
    </footer>

</body>
</html>
