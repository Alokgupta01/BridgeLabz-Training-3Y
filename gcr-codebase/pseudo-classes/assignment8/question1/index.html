<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Pseudo-Classes</h1>
    </header>

    <main>
        <section class="examples">

            <div class="example">
                <h2>:hover</h2>
                <a href="#">Hover over this link</a>
                <p>Changes style when mouse is over it.</p>
            </div>

            <div class="example">
                <h2>:focus</h2>
                <button>Focus on this button</button>
                <p>Changes style when focused.</p>
            </div>

            <div class="example">
                <h2>:active</h2>
                <button>Click this button</button>
                <p>Changes style while being clicked.</p>
            </div>

            <div class="example">
                <h2>:nth-child()</h2>
                <ul>
                    <li>Item 1</li>
                    <li>Item 2</li>
                    <li>Item 3</li>
                    <li>Item 4</li>
                </ul>
                <p>Styles specific list items.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Pseudo-Classes Demonstration</p>
    </footer>

</body>
</html>
