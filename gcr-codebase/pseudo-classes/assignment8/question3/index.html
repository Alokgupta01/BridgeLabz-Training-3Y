<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main>
        <section class="gallery">

            <figure class="image-card">
                <img src="https://picsum.photos/500/350?random=1" alt="Nature">
                <figcaption>Nature</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/500/350?random=2" alt="Mountain">
                <figcaption>Mountain</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/500/350?random=3" alt="Forest">
                <figcaption>Forest</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/500/350?random=4" alt="Beach">
                <figcaption>Beach</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/500/350?random=5" alt="City">
                <figcaption>City</figcaption>
            </figure>

            <figure class="image-card">
                <img src="https://picsum.photos/500/350?random=6" alt="Sunset">
                <figcaption>Sunset</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>Image Showcase</p>
    </footer>

</body>
</html>
