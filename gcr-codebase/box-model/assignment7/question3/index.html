<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gradient Background</h1>
    </header>

    <main>

        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>
                This section uses a linear gradient background.
            </p>
        </section>

        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>
                This section uses a radial gradient background.
            </p>
        </section>

    </main>

    <footer>
        <p>CSS Gradient Demonstration</p>
    </footer>

</body>
</html>
