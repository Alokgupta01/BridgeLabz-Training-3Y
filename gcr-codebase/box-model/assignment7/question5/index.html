<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>

        <section class="items">

            <h2>Items List</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Java</li>
                <li>Cloud Computing</li>
            </ul>

        </section>

        <section class="links">
            <h2>Useful Links</h2>

            <a href="https://www.google.com">Secure Link</a>
            <a href="https://www.github.com">GitHub</a>
            <a href="http://example.com">Normal Link</a>
        </section>

        <section class="form-section">

            <h2>Form</h2>

            <input type="text" placeholder="Enter your name">

            <input type="email" placeholder="Enter your email">

            <button>Submit</button>

            <p>This paragraph demonstrates sibling selectors.</p>

        </section>

    </main>

    <footer>
        <p>Advanced CSS Selectors Demo</p>
    </footer>

</body>
</html>
