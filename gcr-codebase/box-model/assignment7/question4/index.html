<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Shadows and Depth</h1>
    </header>

    <main>
        <section class="cards">

            <article class="card card1">
                <h2>Profile</h2>
                <p>
                    This card demonstrates a soft box shadow effect.
                </p>
            </article>

            <article class="card card2">
                <h2>Projects</h2>
                <p>
                    This card demonstrates a medium shadow effect.
                </p>
            </article>

            <article class="card card3">
                <h2>Services</h2>
                <p>
                    This card demonstrates a deep shadow effect.
                </p>
            </article>

        </section>
    </main>

    <footer>
        <p>CSS Shadow Demonstration</p>
    </footer>

</body>
</html>
