<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="responsive-css-cheat-sheet.css">
</head>
<body>
    <main>
        <h1>Responsive CSS Cheat Sheet</h1>
        <section class="cheat-sheet">
            <article><h2>Filters</h2><p><code>filter: grayscale(100%);</code> changes an image effect.</p></article>
            <article><h2>Media Queries</h2><p><code>@media (max-width: 700px)</code> applies styles to smaller screens.</p></article>
            <article><h2>Responsive Design</h2><p>Use flexible layouts so content fits different screen sizes.</p></article>
            <article><h2>Typography</h2><p><code>clamp()</code> can make text size responsive.</p></article>
        </section>
    </main>
</body>
</html>
