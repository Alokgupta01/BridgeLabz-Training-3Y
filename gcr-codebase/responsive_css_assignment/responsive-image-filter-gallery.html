<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Different CSS filters in a responsive grid.</p>
    </header>

    <main class="gallery">
        <figure class="image-card blur">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
            <figcaption>Blur</figcaption>
        </figure>
        <figure class="image-card grayscale">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
            <figcaption>Grayscale</figcaption>
        </figure>
        <figure class="image-card sepia">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
            <figcaption>Sepia</figcaption>
        </figure>
        <figure class="image-card brightness">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
            <figcaption>Brightness</figcaption>
        </figure>
        <figure class="image-card contrast">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
            <figcaption>Contrast</figcaption>
        </figure>
        <figure class="image-card hue">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
            <figcaption>Hue Rotate</figcaption>
        </figure>
    </main>
</body>
</html>
