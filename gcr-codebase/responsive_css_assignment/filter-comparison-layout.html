<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
    <main>
        <h1>Filter Comparison</h1>
        <section class="comparison">
            <figure>
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Original mountain">
                <figcaption>Before</figcaption>
            </figure>
            <figure class="after">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Filtered mountain">
                <figcaption>After - Contrast</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
