<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>Dashboard</h1>
        </header>

        <aside>
            <h2>Menu</h2>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main>
            <div class="box">
                <h2>Users</h2>
                <p>120 Users</p>
            </div>

            <div class="box">
                <h2>Orders</h2>
                <p>85 Orders</p>
            </div>

            <div class="box">
                <h2>Revenue</h2>
                <p>₹25,000</p>
            </div>

            <div class="box">
                <h2>Projects</h2>
                <p>15 Projects</p>
            </div>
        </main>

    </div>

</body>
</html>
